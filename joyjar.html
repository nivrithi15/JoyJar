<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My JoyJar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Nunito Sans", sans-serif; background: #fff8f6; color: #2b1611; }
    h1, h2 { font-family: "Bricolage Grotesque", sans-serif; }
    .jar { position: relative; width: 270px; height: 330px; border: 12px solid #805062; border-radius: 42px 42px 70px 70px; background: rgba(255,255,255,.62); box-shadow: inset 0 0 20px #ffe2db, 8px 9px 0 #e9bfc9; overflow: hidden; }
    .jar:before { content: ""; position: absolute; width: 180px; height: 25px; background: #6b5e31; border: 7px solid #2b1611; border-radius: 20px; top: -18px; left: 33px; }
    .jar:after { content: ""; position: absolute; inset: 12px; border: 2px dashed #d7c690; border-radius: 30px 30px 55px 55px; pointer-events: none; }
    .joy-note { position: absolute; border: 2px solid #2b1611; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 700; box-shadow: 3px 3px 0 rgba(43,22,17,.18); transform: rotate(var(--r)); max-width: 112px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .polaroid { background: white; border: 9px solid white; border-bottom-width: 26px; border-radius: 4px; box-shadow: 4px 5px 0 rgba(43,22,17,.2); transform: rotate(-2deg); }
  </style>
</head>
<body class="min-h-screen">
  <main class="max-w-6xl mx-auto px-5 py-8 md:py-12">
    <a href="index.html" class="inline-flex items-center gap-2 text-[#805062] font-bold hover:underline">← Back to little moments</a>
    <header class="mt-7 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <p class="font-bold text-[#805062]">A small place for big feelings</p>
        <h1 class="text-4xl md:text-6xl text-[#6b5e31]">Add a little joy ✨</h1>
      </div>
      <p id="status" class="text-sm font-semibold" aria-live="polite"></p>
    </header>

    <section class="grid md:grid-cols-2 gap-10 mt-9 items-start">
      <div class="bg-white rounded-3xl border-2 border-[#cdc6b7] p-6 md:p-8 shadow-[7px_8px_0_#ffe2db]">
        <h2 class="text-2xl text-[#805062]">Put a moment in your jar</h2>
        <form id="joy-form" class="mt-5 space-y-5">
          <label class="block font-bold">What happened?
            <textarea id="joy-text" required maxlength="1000" rows="5" class="mt-2 block w-full rounded-xl border-2 border-[#cdc6b7] bg-[#fff8f6] p-3 focus:border-[#805062] focus:ring-0" placeholder="I had a warm cup of chai with my favourite person..."></textarea>
          </label>
          <label class="block font-bold">A photo (optional)
            <input id="joy-image" type="file" accept="image/*" class="mt-2 block w-full text-sm" />
          </label>
          <div id="photo-preview-wrap" class="hidden overflow-hidden rounded-2xl border-2 border-[#2b1611] bg-[#fff8f6]">
            <img id="photo-preview" class="h-52 w-full object-cover" alt="Uploaded photo preview" />
          </div>
          <button id="save-joy" class="w-full rounded-xl bg-[#ffecb3] border-2 border-[#2b1611] px-5 py-3 font-bold hover:scale-[1.02] transition-transform" type="submit">Save to my JoyJar 💛</button>
        </form>

      </div>

      <div class="flex flex-col items-center rounded-3xl bg-[#d7f5d7] border-2 border-[#57715a] p-8 min-h-[500px]">
        <h2 class="text-2xl text-[#57715a]">Your JoyJar</h2>
        <p class="text-sm mt-1 mb-6">Every saved joy lives here.</p>
        <div id="jar" class="jar flex items-end justify-center pb-5">
          <span class="relative z-10 text-6xl">🌸</span>
        </div>
      </div>
    </section>

    <section class="mt-12">
      <h2 class="text-3xl text-[#6b5e31]">Your saved joy</h2>
      <div id="joy-list" class="mt-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <script>
    const joyStorageKey = "joyjar-memories";
    const form = document.getElementById("joy-form");
    const textInput = document.getElementById("joy-text");
    const imageInput = document.getElementById("joy-image");
    const list = document.getElementById("joy-list");
    const jar = document.getElementById("jar");
    const status = document.getElementById("status");
    const photoPreviewWrap = document.getElementById("photo-preview-wrap");
    const photoPreview = document.getElementById("photo-preview");
    const cloudinaryConfig = {
      cloudName: "dmvuzwlxs",
      uploadPreset: "joyjar",
    };
    const cloudinaryUploadUrl = `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`;
    let uploadedPhoto = null;

    const createCloudinarySignature = async (params) => {
      const raw = Object.entries(params)
        .sort(([left], [right]) => left.localeCompare(right))
        .map(([key, value]) => `${key}=${value}`)
        .join("&") + cloudinaryConfig.apiSecret;
      const bytes = new TextEncoder().encode(raw);
      const digest = await crypto.subtle.digest("SHA-1", bytes);
      return Array.from(new Uint8Array(digest)).map((byte) => byte.toString(16).padStart(2, "0")).join("");
    };

    const readStorage = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; } };
    const memories = () => readStorage(joyStorageKey, []);
    const saveMemories = (items) => localStorage.setItem(joyStorageKey, JSON.stringify(items));
    const escapeHtml = (text) => { const el = document.createElement("div"); el.textContent = text; return el.innerHTML; };
    const publicPath = (id) => id.split("/").map(encodeURIComponent).join("/");
    const normalizeUploadedImage = (item = {}) => ({
      ...item,
      publicId: item.publicId || item.public_id || item.cloudinaryId || null,
      cloudName: item.cloudName || cloudinaryConfig.cloudName,
      imageUrl: item.imageUrl || item.secure_url || null,
      polaroidUrl: item.polaroidUrl || item.thumbnailUrl || null,
    });
    const legacyPolaroidUrl = (item) => item.publicId && item.cloudName
      ? `https://res.cloudinary.com/${item.cloudName}/image/upload/w_700,c_limit,b_14px_solid_white,r_18,e_shadow,q_auto,f_auto/${publicPath(item.publicId)}`
      : null;

    const showPreview = (url) => {
      if (!url) {
        photoPreviewWrap.classList.add("hidden");
        photoPreview.src = "";
        return;
      }
      photoPreview.src = url;
      photoPreviewWrap.classList.remove("hidden");
    };

    const uploadToCloudinary = async (file) => {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("api_key", cloudinaryConfig.apiKey);

      if (cloudinaryConfig.uploadPreset) {
        formData.append("upload_preset", cloudinaryConfig.uploadPreset);
      }

      try {
        const response = await fetch(cloudinaryUploadUrl, {
          method: "POST",
          body: formData,
        });

        const text = await response.text();
        let result = {};
        if (text) {
          try {
            result = JSON.parse(text);
          } catch (error) {
            throw new Error(`Cloudinary returned an invalid response: ${text.slice(0, 120)}`);
          }
        }

        if (response.ok) {
          return normalizeUploadedImage({
            imageUrl: result.secure_url,
            publicId: result.public_id,
            cloudName: cloudinaryConfig.cloudName,
          });
        }

        if (cloudinaryConfig.apiSecret && !cloudinaryConfig.uploadPreset) {
          throw new Error(result.error?.message || "Cloudinary could not upload this photo.");
        }

        throw new Error(result.error?.message || "Cloudinary could not upload this photo.");
      } catch (error) {
        if (cloudinaryConfig.apiSecret && !cloudinaryConfig.uploadPreset) {
          throw error;
        }

        const timestamp = Math.round(Date.now() / 1000);
        const params = { folder: "joyjar/memories", timestamp, resource_type: "image" };
        const signature = await createCloudinarySignature(params);

        const signedData = new FormData();
        signedData.append("file", file);
        signedData.append("api_key", cloudinaryConfig.apiKey);
        signedData.append("timestamp", String(timestamp));
        signedData.append("signature", signature);
        signedData.append("folder", "joyjar/memories");

        const signedResponse = await fetch(cloudinaryUploadUrl, {
          method: "POST",
          body: signedData,
        });

        const signedText = await signedResponse.text();
        let signedResult = {};
        if (signedText) {
          try {
            signedResult = JSON.parse(signedText);
          } catch (error) {
            throw new Error(`Cloudinary returned an invalid response: ${signedText.slice(0, 120)}`);
          }
        }

        if (!signedResponse.ok) {
          throw new Error(signedResult.error?.message || "Cloudinary could not upload this photo.");
        }

        return normalizeUploadedImage({
          imageUrl: signedResult.secure_url,
          publicId: signedResult.public_id,
          cloudName: cloudinaryConfig.cloudName,
        });
      }
    };

    const render = () => {
      const items = memories();
      list.innerHTML = items.length ? "" : '<p class="text-[#4b463b]">Your first happy memory is waiting to be saved.</p>';
      jar.querySelectorAll(".joy-note").forEach((note) => note.remove());
      items.forEach((item, index) => {
        const normalized = normalizeUploadedImage(item);
        const card = document.createElement("article");
        card.className = "rounded-2xl border-2 border-[#2b1611] bg-[#fff0ed] p-5 shadow-[5px_6px_0_#fec1d6]";
        // Supports both current uploads and entries saved before transformed URLs were added.
        const imageSource = normalized.polaroidUrl || legacyPolaroidUrl(normalized) || normalized.imageUrl;
        const image = imageSource
          ? `<img class="polaroid mb-5 h-48 w-full object-cover" src="${escapeHtml(imageSource)}" alt="Memory photo">`
          : "";
        card.innerHTML = `${image}<p class="text-lg">“${escapeHtml(item.text)}”</p>
          <div class="mt-4 flex items-center justify-between gap-3">
            <p class="text-sm italic text-[#805062]">${new Date(item.createdAt).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</p>
            <button type="button" class="delete-joy rounded-lg border-2 border-[#805062] px-3 py-1 text-sm font-bold text-[#805062] hover:bg-[#fec1d6]" data-index="${index}" aria-label="Delete this joy">Delete</button>
          </div>`;
        list.appendChild(card);
        const imageElement = card.querySelector("img");
        if (imageElement && item.imageUrl) {
          imageElement.addEventListener("error", () => {
            if (imageElement.src !== item.imageUrl) imageElement.src = item.imageUrl;
          }, { once: true });
        }
        if (index < 7) {
          const note = document.createElement("span");
          note.className = "joy-note z-10";
          note.style.setProperty("--r", `${[-10, 8, -4, 12, -14, 5, -7][index]}deg`);
          note.style.left = `${24 + ((index * 51) % 145)}px`;
          note.style.bottom = `${26 + ((index * 43) % 170)}px`;
          note.style.background = ["#ffecb3", "#fec1d6", "#cceacd"][index % 3];
          note.textContent = item.text;
          jar.appendChild(note);
        }
      });
    };

    list.addEventListener("click", (event) => {
      const deleteButton = event.target.closest(".delete-joy");
      if (!deleteButton) return;
      const allMemories = memories();
      allMemories.splice(Number(deleteButton.dataset.index), 1);
      saveMemories(allMemories);
      status.textContent = "That joy was removed from your jar.";
      render();
    });

    imageInput.addEventListener("change", async () => {
      const file = imageInput.files[0];
      if (!file) {
        uploadedPhoto = null;
        showPreview(null);
        return;
      }

      try {
        status.textContent = "Uploading your photo…";
        uploadedPhoto = await uploadToCloudinary(file);
        showPreview(uploadedPhoto.imageUrl);
        status.textContent = "Photo ready to save!";
      } catch (error) {
        uploadedPhoto = null;
        showPreview(null);
        status.textContent = error.message;
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = textInput.value.trim();
      if (!text) return;
      const button = document.getElementById("save-joy");
      let photoError = null;

      try {
        if (imageInput.files[0] && !uploadedPhoto) {
          button.disabled = true;
          button.textContent = "Adding your photo…";
          uploadedPhoto = await uploadToCloudinary(imageInput.files[0]);
          showPreview(uploadedPhoto.imageUrl);
        }
      } catch (error) {
        photoError = error;
      } finally {
        button.disabled = false;
        button.textContent = "Save to my JoyJar 💛";
      }

      const allMemories = memories();
      allMemories.unshift({
        id: crypto.randomUUID(),
        text,
        createdAt: new Date().toISOString(),
        ...(uploadedPhoto || {}),
      });
      saveMemories(allMemories);
      form.reset();
      imageInput.value = "";
      uploadedPhoto = null;
      showPreview(null);
      status.textContent = photoError
        ? `Your joy was saved, but the photo could not upload: ${photoError.message}`
        : "A little joy was added to your jar!";
      render();
    });

    render();
  </script>
</body>
</html>
